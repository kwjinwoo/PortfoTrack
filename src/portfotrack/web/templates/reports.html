{% extends "base.html" %}

{% block content %}
<section class="reports-page">
  <h2>할당 리포트</h2>

  <div class="card">
    <h3>리포트 생성</h3>
    <form id="report-form">
      <div class="form-grid">
        <div class="form-group">
          <label for="snapshot-date-select">스냅샷 날짜</label>
          <select id="snapshot-date-select" name="snapshot_date" required>
            <option value="">스냅샷을 선택하세요</option>
          </select>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">리포트 생성</button>
      <div id="report-message" class="message"></div>
      <div id="report-empty-state" class="empty-state" style="display:none;">
        <strong>리포트를 만들 스냅샷이 없습니다.</strong>
        <p>현재 금액 스냅샷을 먼저 기록하면 타겟 배분과 비교할 수 있습니다.</p>
        <div class="empty-state-actions">
          <a class="btn btn-primary" href="/snapshots">스냅샷 기록하기</a>
        </div>
      </div>
    </form>
  </div>

  <div class="card" id="report-result-card" style="display:none;">
    <h3>할당 비교 리포트 — <span id="report-date"></span></h3>
    <div id="report-summary" class="report-summary"></div>
    <div id="report-judgement" class="report-judgement" aria-live="polite">
      <div class="report-judgement-card">
        <span class="summary-label">허용 범위 밖</span>
        <strong id="report-drift-count">-</strong>
        <span id="report-drift-count-detail" class="summary-meta">-</span>
      </div>
      <div class="report-judgement-card">
        <span class="summary-label">가장 큰 초과</span>
        <strong id="report-largest-over">-</strong>
        <span id="report-largest-over-detail" class="summary-meta">-</span>
      </div>
      <div class="report-judgement-card">
        <span class="summary-label">가장 큰 부족</span>
        <strong id="report-largest-under">-</strong>
        <span id="report-largest-under-detail" class="summary-meta">-</span>
      </div>
    </div>
    <div id="report-drift-highlights" class="report-drift-highlights"></div>
    <div class="table-scroll">
      <table id="report-table">
        <thead>
          <tr>
            <th>자산</th>
            <th>현재 금액</th>
            <th>현재 비율</th>
            <th>목표 비율</th>
            <th>진행률</th>
            <th>필요 금액</th>
            <th>상태</th>
          </tr>
        </thead>
        <tbody id="report-items"></tbody>
      </table>
    </div>
    <div id="report-footer" class="report-footer"></div>
  </div>
</section>

<script src="{{ url_for('static', filename='js/reports-ui.js') }}"></script>
{% endblock %}
