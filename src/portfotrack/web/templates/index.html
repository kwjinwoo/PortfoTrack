{% extends "base.html" %}

{% block content %}
<section class="dashboard">
  <div class="page-header">
    <div>
      <h2>대시보드</h2>
      <p class="page-kicker">최신 스냅샷, 타겟 설정, 리밸런싱 상태를 한 곳에서 확인합니다.</p>
    </div>
  </div>

  <div class="dashboard-setup-flow" id="dashboard-setup-flow" aria-label="초기 설정 진행">
    <a class="setup-step is-waiting" href="/targets" data-setup-step="target">
      <span class="setup-step-index">1</span>
      <span>
        <strong>타겟 배분</strong>
        <small data-setup-status>대기</small>
      </span>
    </a>
    <a class="setup-step is-waiting" href="/snapshots" data-setup-step="snapshot">
      <span class="setup-step-index">2</span>
      <span>
        <strong>스냅샷 기록</strong>
        <small data-setup-status>대기</small>
      </span>
    </a>
    <a class="setup-step is-waiting" href="/reports" data-setup-step="report">
      <span class="setup-step-index">3</span>
      <span>
        <strong>리포트 확인</strong>
        <small data-setup-status>대기</small>
      </span>
    </a>
    <a class="setup-step is-waiting" href="/trends" data-setup-step="trend">
      <span class="setup-step-index">4</span>
      <span>
        <strong>추이 보기</strong>
        <small data-setup-status>대기</small>
      </span>
    </a>
  </div>

  <div class="dashboard-summary" id="dashboard-summary" aria-live="polite">
    <div class="summary-card">
      <span class="summary-label">최신 스냅샷</span>
      <strong id="latest-snapshot-date">불러오는 중...</strong>
      <span id="latest-snapshot-total" class="summary-meta">-</span>
    </div>
    <div class="summary-card">
      <span class="summary-label">타겟 배분</span>
      <strong id="target-status">확인 중</strong>
      <span id="target-asset-count" class="summary-meta">-</span>
    </div>
    <div class="summary-card">
      <span class="summary-label">리밸런싱 상태</span>
      <strong id="drift-status">확인 중</strong>
      <span id="drift-detail" class="summary-meta">-</span>
    </div>
  </div>

  <div class="dashboard-panel">
    <div>
      <h3>다음 행동</h3>
      <p id="dashboard-guidance">현재 데이터를 확인하고 있습니다.</p>
    </div>
    <div class="dashboard-actions section-actions" id="dashboard-next-actions">
      <a class="btn btn-primary" href="/snapshots">스냅샷 기록</a>
      <a class="btn btn-secondary" href="/reports">리포트 보기</a>
      <a class="btn btn-secondary" href="/targets">타겟 설정</a>
    </div>
  </div>

  <div class="dashboard-panel is-hidden" id="dashboard-drift-panel">
    <h3>허용 범위 밖 자산</h3>
    <ul id="dashboard-drift-list" class="dashboard-list"></ul>
  </div>
</section>

<script src="{{ url_for('static', filename='js/dashboard-ui.js') }}"></script>
{% endblock %}
