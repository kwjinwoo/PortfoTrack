{% extends "base.html" %}

{% block content %}
<section class="targets-page">
  <h2>타겟 배분 관리</h2>

  <div class="card">
    <h3>현재 타겟</h3>
    <div id="target-status"></div>
    <div class="table-scroll">
      <table id="target-table" class="is-hidden">
        <thead>
          <tr>
            <th>자산 ID</th>
            <th>이름</th>
            <th>용도</th>
            <th>목표 비율</th>
            <th>허용 범위</th>
            <th>관리</th>
          </tr>
        </thead>
        <tbody id="target-assets"></tbody>
      </table>
    </div>
    <button type="button" id="create-target-btn" class="btn btn-primary is-hidden">새 타겟 생성</button>
    <button type="button" id="edit-target-btn" class="btn btn-secondary is-hidden">타겟 편집</button>
  </div>

  <div class="card is-hidden" id="target-edit-card">
    <h3>타겟 편집</h3>
    <div id="edit-assets-container"></div>
    <button type="button" id="edit-add-asset-btn" class="btn btn-secondary">+ 자산 추가</button>
    <div class="form-group stacked-control">
      <label>저장 방식</label>
      <label><input type="radio" name="target-save-mode" value="overwrite" checked> 기존 파일 덮어쓰기</label>
      <label><input type="radio" name="target-save-mode" value="new"> 새 타겟으로 저장</label>
    </div>
    <div id="target-ratio-warning" class="message warning is-hidden" role="status" aria-live="polite">
      <strong>목표 비율 합계가 100%가 아닙니다.</strong>
      <p id="target-ratio-warning-detail"></p>
      <button type="button" id="confirm-target-save-btn" class="btn btn-primary">그래도 저장</button>
      <button type="button" id="cancel-target-save-btn" class="btn btn-secondary">다시 조정</button>
    </div>
    <button type="button" id="edit-target-save-btn" class="btn btn-primary">저장</button>
    <button type="button" id="edit-target-cancel-btn" class="btn btn-secondary">취소</button>
    <div id="edit-target-message" class="message" role="status" aria-live="polite"></div>
  </div>

  <div class="card" id="add-asset-card">
    <h3>자산 추가</h3>
    <form id="add-asset-form">
      <div class="form-grid">
        <div class="form-group">
          <label for="asset-id">자산 ID</label>
          <input type="text" id="asset-id" name="asset_id" required placeholder="예: us_equity">
        </div>
        <div class="form-group">
          <label for="asset-name">이름</label>
          <input type="text" id="asset-name" name="asset_name" required placeholder="예: US Equity">
        </div>
        <div class="form-group">
          <label for="asset-purpose">용도</label>
          <input type="text" id="asset-purpose" name="purpose" required placeholder="예: growth">
        </div>
        <div class="form-group">
          <label for="target-ratio">목표 비율 (%)</label>
          <input type="number" id="target-ratio" name="target_ratio" step="0.1" min="0" max="100" required placeholder="예: 60">
        </div>
        <div class="form-group">
          <label for="lower-bound">하한 (%)</label>
          <input type="number" id="lower-bound" name="lower" step="0.1" min="0" max="100" required placeholder="예: 50">
        </div>
        <div class="form-group">
          <label for="upper-bound">상한 (%)</label>
          <input type="number" id="upper-bound" name="upper" step="0.1" min="0" max="100" required placeholder="예: 70">
        </div>
      </div>
      <button type="submit" class="btn btn-primary">자산 추가</button>
      <div id="target-message" class="message" role="status" aria-live="polite"></div>
    </form>
  </div>
</section>

<script src="{{ url_for('static', filename='js/targets-ui.js') }}"></script>
{% endblock %}
