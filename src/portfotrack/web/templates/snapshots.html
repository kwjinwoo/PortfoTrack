{% extends "base.html" %}

{% block content %}
<section class="snapshots-page">
  <div class="page-header">
    <div>
      <h2>스냅샷 관리</h2>
      <p class="page-kicker">자산군별 현재 금액을 날짜별 로컬 스냅샷으로 기록합니다.</p>
    </div>
  </div>

  <div class="card">
    <h3>스냅샷 목록</h3>
    <div class="table-scroll">
      <table id="snapshot-table" class="table-financial">
        <thead>
          <tr>
            <th>날짜</th>
            <th>파일명</th>
            <th>액션</th>
          </tr>
        </thead>
        <tbody id="snapshot-list">
          <tr>
            <td colspan="3">로딩 중...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h3>새 스냅샷 생성</h3>
    <div id="no-target-warning" class="message error is-hidden" role="status" aria-live="polite">
      타겟 배분이 설정되지 않았습니다. 먼저 타겟을 생성하세요.
      <a href="/targets">타겟 설정으로 이동</a>
    </div>
    <form id="create-snapshot-form">
      <div id="snapshot-items-container">
        <div class="item-row snapshot-item-row">
          <div class="form-group">
            <label>자산 ID</label>
            <select name="asset_id" required>
              <option value="">로딩 중...</option>
            </select>
          </div>
          <div class="form-group">
            <label>라벨</label>
            <input type="text" name="label" required placeholder="예: S&P500">
          </div>
          <div class="form-group">
            <label>금액 (KRW)</label>
            <input class="amount-input" type="number" name="amount" inputmode="numeric" required placeholder="예: 5000000">
          </div>
        </div>
      </div>
      <div class="form-actions">
        <button type="button" id="add-item-btn" class="btn btn-secondary">+ 항목 추가</button>
        <button type="submit" class="btn btn-primary">스냅샷 저장</button>
      </div>
      <div id="snapshot-message" class="message" role="status" aria-live="polite"></div>
    </form>
  </div>

  <div class="card is-hidden" id="snapshot-detail-card">
    <h3>스냅샷 상세 — <span id="snapshot-detail-date"></span></h3>
    <div class="table-scroll">
      <table class="table-financial">
        <thead>
          <tr>
            <th>자산 ID</th>
            <th>라벨</th>
            <th>금액 (KRW)</th>
          </tr>
        </thead>
        <tbody id="snapshot-detail-items"></tbody>
      </table>
    </div>
    <div class="form-group stacked-control export-options">
      <label class="choice-control"><input type="checkbox" id="export-include-labels" checked> 세부 항목명 포함</label>
      <label class="choice-control"><input type="checkbox" id="export-hide-amounts"> 금액 숨기고 비중만 표시</label>
    </div>
    <div class="form-actions">
      <button type="button" id="copy-chatgpt-export-btn" class="btn btn-primary">ChatGPT용 복사</button>
      <button type="button" id="save-chatgpt-export-btn" class="btn btn-secondary">Markdown 저장</button>
      <button type="button" id="save-allocation-json-btn" class="btn btn-secondary">할당 JSON 저장</button>
    </div>
    <div id="export-message" class="message" role="status" aria-live="polite"></div>
  </div>

  <div class="card is-hidden" id="snapshot-edit-card">
    <h3>스냅샷 편집 — <span id="edit-snapshot-date"></span></h3>
    <div id="edit-items-container"></div>
    <div class="form-actions">
      <button type="button" id="edit-add-item-btn" class="btn btn-secondary">+ 항목 추가</button>
    </div>
    <div class="form-group stacked-control">
      <label>저장 방식</label>
      <label class="choice-control"><input type="radio" name="save-mode" value="overwrite" checked> 기존 파일 덮어쓰기</label>
      <label class="choice-control"><input type="radio" name="save-mode" value="new"> 새 스냅샷으로 저장</label>
    </div>
    <div class="form-actions">
      <button type="button" id="edit-save-btn" class="btn btn-primary">저장</button>
    </div>
    <div id="edit-message" class="message" role="status" aria-live="polite"></div>
  </div>
</section>

<script src="{{ url_for('static', filename='js/snapshots-ui.js') }}"></script>
{% endblock %}
